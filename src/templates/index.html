<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}" />
  <meta property="og:title" content="{{TITLE}}" />
  <meta property="og:description" content="{{DESCRIPTION}}" />
  <meta name="generator" content="Lumen3D" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d1a'/%3E%3Cpath d='M16 5l10 6v10l-10 6-10-6V11z' fill='none' stroke='%238a7dff' stroke-width='2' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%234de1c1'/%3E%3C/svg%3E" />
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #05060d; }
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #lumen-root { position: fixed; inset: 0; }
    #lumen-canvas { display: block; }

    .lumen-loader {
      position: fixed; inset: 0; display: grid; place-items: center;
      background: #05060d; color: #cfd4ff; z-index: 50;
      transition: opacity .5s ease; font-size: 14px; letter-spacing: .08em;
      text-transform: uppercase;
    }
    .lumen-loader.hidden { opacity: 0; pointer-events: none; }
    .lumen-spinner {
      width: 34px; height: 34px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.15); border-top-color: #8a7dff;
      animation: lumen-spin 0.8s linear infinite; margin-bottom: 14px;
    }
    .lumen-loader div { display: flex; flex-direction: column; align-items: center; }
    @keyframes lumen-spin { to { transform: rotate(360deg); } }

    /* Overlay UI injected by the engine */
    .lumen-overlay {
      position: fixed; z-index: 20; max-width: min(560px, 86vw);
      padding: 22px 24px; pointer-events: none;
    }
    .lumen-overlay > * { pointer-events: auto; }
    .lumen-bottom-left { left: 4vw; bottom: 6vh; }
    .lumen-top-left { left: 4vw; top: 6vh; }
    .lumen-bottom-center { left: 50%; bottom: 6vh; transform: translateX(-50%); text-align: center; }
    .lumen-center { left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; }
    .lumen-theme-light { color: #f4f6ff; }
    .lumen-theme-dark { color: #10121f; }
    .lumen-eyebrow {
      font-size: 12px; letter-spacing: .22em; text-transform: uppercase;
      color: var(--lumen-accent, #8a7dff); font-weight: 600; margin-bottom: 12px;
    }
    .lumen-title {
      font-size: clamp(32px, 6vw, 64px); line-height: 1.02; font-weight: 800;
      letter-spacing: -0.02em; margin-bottom: 14px;
      text-shadow: 0 2px 30px rgba(0,0,0,.35);
    }
    .lumen-desc {
      font-size: clamp(15px, 1.6vw, 18px); line-height: 1.55; opacity: .82;
      max-width: 46ch;
    }
    .lumen-bottom-center .lumen-desc, .lumen-center .lumen-desc { margin-inline: auto; }
    .lumen-links { display: flex; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
    .lumen-bottom-center .lumen-links, .lumen-center .lumen-links { justify-content: center; }
    .lumen-link {
      display: inline-flex; align-items: center; text-decoration: none;
      font-size: 14px; font-weight: 600; padding: 11px 20px; border-radius: 999px;
      background: var(--lumen-accent, #8a7dff); color: #0a0b14;
      transition: transform .15s ease, box-shadow .15s ease;
      box-shadow: 0 6px 24px -6px var(--lumen-accent, #8a7dff);
    }
    .lumen-link:hover { transform: translateY(-2px); box-shadow: 0 10px 30px -6px var(--lumen-accent, #8a7dff); }
    .lumen-link + .lumen-link {
      background: transparent; color: inherit; box-shadow: none;
      border: 1px solid currentColor; opacity: .85;
    }

    .lumen-badge {
      position: fixed; right: 14px; bottom: 12px; z-index: 20;
      font-size: 11px; letter-spacing: .05em; color: rgba(255,255,255,.35);
      text-decoration: none; pointer-events: auto;
    }
    .lumen-badge:hover { color: rgba(255,255,255,.7); }
  </style>
  {{IMPORTMAP}}
</head>
<body>
  <div id="lumen-root"></div>
  <div class="lumen-loader" id="lumen-loader">
    <div><div class="lumen-spinner"></div>Loading scene</div>
  </div>
  <a class="lumen-badge" href="https://github.com/zackarman28346-sketch/https-github.com-zackarman28346-sketch-claude" target="_blank" rel="noopener">built with Lumen3D</a>

  <script type="module">
    import { boot } from './engine.js';
    boot('./config.json')
      .then(() => {
        const l = document.getElementById('lumen-loader');
        if (l) { l.classList.add('hidden'); setTimeout(() => l.remove(), 600); }
      })
      .catch((err) => {
        console.error('[lumen3d] boot failed', err);
        const l = document.getElementById('lumen-loader');
        if (l) l.innerHTML = '<div style="color:#ff7a7a">Failed to load scene — see console</div>';
      });
  </script>
</body>
</html>
